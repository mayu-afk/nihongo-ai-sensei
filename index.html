<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI先生 — 日本語文法学習</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap">
  <style>
    * { font-family: 'Noto Sans JP', -apple-system, 'Hiragino Sans', sans-serif; }

    @keyframes gradShift {
      0%,100%{ background-position:0% 50%; } 50%{ background-position:100% 50%; }
    }
    .gradient-text {
      background: linear-gradient(135deg,#7c3aed,#db2777,#2563eb);
      background-size:300% 300%; animation:gradShift 5s ease infinite;
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    }

    @keyframes fadeInUp {
      from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)}
    }
    .fiu  {animation:fadeInUp .4s ease-out both}
    .fiu1 {animation:fadeInUp .4s .10s ease-out both}
    .fiu2 {animation:fadeInUp .4s .20s ease-out both}
    .fiu3 {animation:fadeInUp .4s .32s ease-out both}
    .fiu4 {animation:fadeInUp .4s .44s ease-out both}

    @keyframes bDot {
      0%,80%,100%{transform:scale(.5);opacity:.4} 40%{transform:scale(1);opacity:1}
    }
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#8b5cf6}
    .dot:nth-child(1){animation:bDot 1.3s ease-in-out 0s infinite}
    .dot:nth-child(2){animation:bDot 1.3s ease-in-out .15s infinite}
    .dot:nth-child(3){animation:bDot 1.3s ease-in-out .30s infinite}

    @keyframes float {0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)}}
    .floating{animation:float 2.6s ease-in-out infinite}

    @keyframes popIn {
      0%{transform:scale(.5);opacity:0} 70%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1}
    }
    .pop-in{animation:popIn .42s ease-out both}

    @keyframes slideInRight {
      from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1}
    }
    .slide-in{animation:slideInRight .35s cubic-bezier(.22,1,.36,1) both}

    @keyframes growUp {
      from{transform:scale(.8) translateY(10px);opacity:0} to{transform:scale(1) translateY(0);opacity:1}
    }
    .grow-up{animation:growUp .5s cubic-bezier(.34,1.56,.64,1) both}

    /* ナレッジバッジ */
    @keyframes pulse-badge {
      0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,.4)}
      50%{box-shadow:0 0 0 6px rgba(124,58,237,0)}
    }
    .badge-pulse{animation:pulse-badge 2s ease-in-out infinite}

    /* 成長トースト */
    @keyframes toastIn {
      from{transform:translateY(80px);opacity:0} to{transform:translateY(0);opacity:1}
    }
    @keyframes toastOut {
      from{transform:translateY(0);opacity:1} to{transform:translateY(80px);opacity:0}
    }
    .toast-in {animation:toastIn .4s cubic-bezier(.22,1,.36,1) both}
    .toast-out{animation:toastOut .3s ease-in both}

    .opt-card{transition:transform .18s,box-shadow .18s;cursor:pointer}
    .opt-card:not(:disabled):hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(139,92,246,.18)}
    .opt-card:not(:disabled):active{transform:translateY(0)}

    .chip{transition:background .15s,color .15s}
    .chip:hover{background:#ede9fe;color:#6d28d9}

    textarea:focus,input:focus,select:focus{outline:none;box-shadow:0 0 0 3px rgba(139,92,246,.25)}

    /* Admin panel */
    .admin-overlay{
      position:fixed;inset:0;z-index:50;
      background:rgba(15,10,40,.6);backdrop-filter:blur(6px);
    }
    .admin-panel{
      position:fixed;top:0;right:0;bottom:0;width:100%;max-width:520px;
      background:#faf9ff;overflow-y:auto;z-index:51;
    }
    .form-label{display:block;font-size:.75rem;font-weight:700;color:#6d28d9;margin-bottom:4px}
    .form-input{
      width:100%;border:2px solid #e9d5ff;border-radius:12px;padding:8px 12px;
      font-size:.875rem;color:#374151;transition:border-color .2s;background:#fff;
    }
    .form-input:focus{border-color:#8b5cf6}

    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#ddd6fe;border-radius:3px}
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-violet-50 via-rose-50 to-sky-50">
<div id="root"></div>

  { id:'ta_koto', pat_str:'たことがある|たことがあり', name:'〜たことがある', romaji:'～ta koto ga aru', level:'N4',
    tag_zh:'有过〜的经历', summary_zh:'表示过去曾经有过某种体验或经历，用于分享人生经验。',

  { id:'ni_ikimasu', pat_str:'[にへ]行き|[にへ]来ます|[にへ]帰り|に行く|へ行く', name:'〜に/へ行きます', romaji:'～ni / e ikimasu', level:'N5',

function loadLogs() { try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch(e){ return []; } }
function saveLogs(arr) { localStorage.setItem(LOG_KEY, JSON.stringify(arr)); }
async function appendLog(entry) {
  const full = {...entry, savedAt: new Date().toISOString()};
  // localStorage キャッシュ
  const arr = loadLogs(); arr.unshift(full);
  if (arr.length > 300) arr.length = 300; saveLogs(arr);

/* ─── テキスト解析ロジック ─── */
function scanText(text, db) {
  const sentences = text.split(/[。！？\n]+/).map(s => s.trim()).filter(s => s.length > 3);
  const found = new Map();   // id → { grammar, sentences }
  const cands = new Map();   // pat_str → { hint, sentences }
  for (const sent of sentences) {
    for (const g of db) {
      const p = toPat(g.pat_str); if (!p || !p.test(sent)) continue;
      if (!found.has(g.id)) found.set(g.id, { grammar:g, sentences:[] });
      if (found.get(g.id).sentences.length < 3) found.get(g.id).sentences.push(sent);
    }
    for (const hint of GRAMMAR_HINTS) {
      if (db.some(g => g.name === hint.name)) continue; // already registered
      const p = toPat(hint.pat_str); if (!p || !p.test(sent)) continue;
      if (!cands.has(hint.pat_str)) cands.set(hint.pat_str, { hint, sentences:[] });
      if (cands.get(hint.pat_str).sentences.length < 3) cands.get(hint.pat_str).sentences.push(sent);
    }
  }
  return { found:[...found.values()], cands:[...cands.values()], total: sentences.length };
}

/* ─── URL fetch via CORS proxy ─── */
async function fetchPageText(url) {
  const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}&t=${Date.now()}`;
  const res   = await fetch(proxy);
  const data  = await res.json();
  const parser = new DOMParser();
  const doc    = parser.parseFromString(data.contents || '', 'text/html');
  ['script','style','nav','footer','header','aside','form'].forEach(tag =>
    [...doc.querySelectorAll(tag)].forEach(el => el.remove())
  );
  return (doc.body?.innerText || doc.body?.textContent || '').replace(/[ \t]+/g,' ').trim();
}

          {tab==='resources' && <ResourcesPanel onStartLoop={() => { switchTab('add'); setAddMode('audio'); }} />}

          {/* 背景情報タブ */}
          {tab==='context' && <BackgroundPanel />}
        </div>
      </div>
    </>
  );
}

/* ══════════════════════════════════════════════
   GRAMMAR FORM（追加 / 編集）
   ══════════════════════════════════════════════ */
function GrammarForm({ mode, initial, onSave, onCancel }) {
  const def = initial || EMPTY_FORM;
  const [f, setF] = useState({
    ...def,
    examples: def.examples?.length >= 2 ? def.examples : [{ja:'',zh:''},{ja:'',zh:''}],
    quiz: def.quiz || EMPTY_FORM.quiz,
  });
  const [patErr, setPatErr] = useState('');

  const set = (key, val) => setF(p => ({...p, [key]: val}));
  const setEx = (i, k, v) => setF(p => { const ex=[...p.examples]; ex[i]={...ex[i],[k]:v}; return {...p,examples:ex}; });
  const setQO = (i, k, v) => setF(p => { const opts=[...p.quiz.opts]; opts[i]={...opts[i],[k]:v}; return {...p,quiz:{...p.quiz,opts}}; });
  const setQ  = (k, v) => setF(p => ({...p, quiz:{...p.quiz,[k]:v}}));

  const save = () => {
    if (!f.name.trim())    return alert('文法名を入力してください');
    if (!f.pat_str.trim()) return alert('検出パターンを入力してください');
    const p = toPat(f.pat_str);
    if (!p) { setPatErr('無効な正規表現です'); return; }
    setPatErr('');
    if (!f.tag_zh.trim())  return alert('中国語タグを入力してください');
    onSave({ ...f, id: f.id || uid() });
  };

  const LBL = ({ch}) => <label className="form-label">{ch}</label>;
  const INP = ({fld, ph, ...rest}) => (
    <input className="form-input" placeholder={ph||''} value={f[fld]||''} onChange={e=>set(fld,e.target.value)} {...rest} />
  );
  const SEL = ({fld, opts}) => (
    <select className="form-input" value={f[fld]} onChange={e=>set(fld,e.target.value)}>
      {opts.map(o=><option key={o}>{o}</option>)}
    </select>
  );
  const TA = ({fld, rows=3, ph}) => (
    <textarea className="form-input" rows={rows} placeholder={ph||''} value={f[fld]||''} onChange={e=>set(fld,e.target.value)} />
  );

  return (
    <div className="space-y-5 pb-10">
      <div className="text-sm font-bold text-purple-600 bg-purple-50 rounded-xl px-3 py-2">
        {mode==='add' ? '➕ 新しい文法を追加' : `✏️ 編集中: ${f.name}`}
      </div>

      {/* ── 基本情報 ── */}
      <Section title="① 基本情報 / 基本信息">
        <div className="grid grid-cols-2 gap-3">
          <div className="col-span-2"><LBL ch="文法名（例: 〜てみたい）" /><INP fld="name" ph="〜てみたい" /></div>
          <div><LBL ch="ローマ字" /><INP fld="romaji" ph="～te mitai" /></div>
          <div><LBL ch="レベル" /><SEL fld="level" opts={LEVELS} /></div>
          <div className="col-span-2">
            <LBL ch="検出パターン（正規表現）" />
            <INP fld="pat_str" ph="[てで]みたい" />
            {patErr && <p className="text-xs text-rose-500 mt-1">{patErr}</p>}
            <p className="text-xs text-gray-400 mt-1">テキスト内のこのパターンを検出すると本文法が選ばれます</p>
          </div>
        </div>
      </Section>

      {/* ── 中国語解説 ── */}
      <Section title="② 中国語解説 / 中文解说">
        <div className="space-y-3">
          <div><LBL ch="タグ（短い意味）" /><INP fld="tag_zh" ph="想试着做〜" /></div>
          <div><LBL ch="概要（1〜2文）" /><INP fld="summary_zh" ph="表达想要尝试某件事的愿望..." /></div>
          <div><LBL ch="接続ルール" /><INP fld="conj_rule" ph="动词て形 ＋ みたい" /></div>
          <div><LBL ch="接続例" /><INP fld="conj_ex" ph="食べる → 食べてみたい" /></div>
          <div><LBL ch="詳細説明（中国語）" /><TA fld="detail_zh" rows={4} ph="「みたい」来自「みる（试试看）」..." /></div>
        </div>
      </Section>

      {/* ── 例文 ── */}
      <Section title="③ 例文 / 例句">
        {[0,1].map(i => (
          <div key={i} className="bg-amber-50 rounded-xl p-3 mb-2 space-y-2">
            <p className="text-xs font-bold text-amber-600">例文 {i+1}</p>
            <div>
              <LBL ch="日本語" />
              <input className="form-input" placeholder="日本料理を作ってみたい。" value={f.examples[i]?.ja||''} onChange={e=>setEx(i,'ja',e.target.value)} />
            </div>
            <div>
              <LBL ch="中国語訳" />
              <input className="form-input" placeholder="想试着做日本料理。" value={f.examples[i]?.zh||''} onChange={e=>setEx(i,'zh',e.target.value)} />
            </div>
          </div>
        ))}
      </Section>

      {/* ── クイズ ── */}
      <Section title="④ クイズ / 测验">
        <div className="space-y-3">
          <div><LBL ch="問題文（日本語）穴は（　　）で表記" /><INP fld="" ph="富士山に（　　）みたいです。" value={f.quiz.q_ja} onChange={e=>setQ('q_ja',e.target.value)} /></div>
          <div><LBL ch="問題文（中国語ヒント）" /><INP fld="" ph="我想试着攀登富士山。括号里该填什么？" value={f.quiz.q_zh} onChange={e=>setQ('q_zh',e.target.value)} /></div>
          {[0,1].map(i => (
            <div key={i} className="bg-indigo-50 rounded-xl p-3 space-y-2">
              <div className="flex items-center gap-2">
                <span className="text-sm font-black text-indigo-400">{f.quiz.opts[i]?.id||['A','B'][i]}</span>
                <input className="form-input flex-1" placeholder={i===0?'登って':'登り'} value={f.quiz.opts[i]?.text||''} onChange={e=>setQO(i,'text',e.target.value)} />
                <label className="flex items-center gap-1 text-xs font-bold text-emerald-600 whitespace-nowrap cursor-pointer">
                  <input type="radio" name="correct" checked={f.quiz.opts[i]?.correct===true} onChange={()=>setF(p=>({...p,quiz:{...p.quiz,opts:p.quiz.opts.map((o,j)=>({...o,correct:j===i}))}}))} />
                  正解
                </label>
              </div>
            </div>
          ))}
          <div><LBL ch="正解時のメッセージ" /><INP fld="" ph="「登る」のて形は「登って」 ✅" value={f.quiz.ok_msg} onChange={e=>setQ('ok_msg',e.target.value)} /></div>
          <div><LBL ch="不正解時のメッセージ" /><INP fld="" ph="「登り」はます形です..." value={f.quiz.ng_msg} onChange={e=>setQ('ng_msg',e.target.value)} /></div>
        </div>
      </Section>

      {/* ── ボタン ── */}
      <div className="flex gap-3 pt-2">
        <button onClick={onCancel} className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-3 rounded-2xl transition-colors">キャンセル</button>
        <button onClick={save} className="flex-1 bg-gradient-to-r from-violet-500 to-purple-600 hover:from-violet-600 hover:to-purple-700 text-white font-bold py-3 rounded-2xl transition-all shadow-md">
          {mode==='add' ? '🧠 食べさせる（追加）' : '✅ 更新する'}
        </button>
      </div>
    </div>
  );
}

/* ─── レッスンログ ─── */
function LessonLogPanel() {
  const [logs, setLogs] = React.useState(() => loadLogs());

  const clearLogs = () => {
    if (!window.confirm('ログを全件削除しますか？')) return;
    saveLogs([]); setLogs([]);
  };
  const exportCSV = () => {
    if (!logs.length) return alert('ログがありません');
    downloadCSV(toCSV(logs), `ai_sensei_log_${new Date().toISOString().slice(0,10)}.csv`);
  };
  const refresh = () => setLogs(loadLogs());

  const fmtDate = (s) => {
    if (!s) return '—';
    try { return new Date(s).toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(e){ return s; }
  };

  return (
    <div className="space-y-3">
      <div className="flex items-center justify-between">
        <div>
          <p className="text-sm font-black text-gray-700">📋 レッスンログ</p>
          <p className="text-xs text-gray-400">{logs.length}件 — クイズ回答時に自動記録</p>
        </div>
        <div className="flex gap-1.5">
          <button onClick={refresh} className="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-2.5 py-1.5 rounded-lg font-bold transition-colors">↻ 更新</button>
          <button onClick={exportCSV} className="text-xs bg-indigo-500 hover:bg-indigo-600 text-white px-2.5 py-1.5 rounded-lg font-bold transition-colors">CSV↓</button>
          {logs.length > 0 && <button onClick={clearLogs} className="text-xs bg-rose-100 hover:bg-rose-200 text-rose-600 px-2.5 py-1.5 rounded-lg font-bold transition-colors">削除</button>}
        </div>
      </div>

      {logs.length === 0 ? (
        <div className="bg-gray-50 rounded-2xl border border-dashed border-gray-200 p-8 text-center">
          <p className="text-3xl mb-2">📋</p>
          <p className="text-xs text-gray-400">まだログがありません。<br/>クイズを解くと自動的に記録されます。</p>
        </div>
      ) : (
        <div className="space-y-1.5 max-h-96 overflow-y-auto pr-1">
          {logs.slice(0,80).map((r,i) => (
            <div key={i} className="bg-white rounded-xl border border-gray-100 px-3 py-2.5 flex items-center gap-2 shadow-sm">
              <span className={`shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs font-black ${r.quizResult==='ok' ? 'bg-emerald-100 text-emerald-600' : r.quizResult==='ng' ? 'bg-rose-100 text-rose-500' : 'bg-gray-100 text-gray-400'}`}>
                {r.quizResult==='ok' ? '✓' : r.quizResult==='ng' ? '✗' : '—'}
              </span>
              <div className="flex-1 min-w-0">
                <p className="text-xs font-bold text-gray-700 truncate">{r.detectedGrammarName || '—'}</p>
                <p className="text-xs text-gray-400 truncate">{r.userInput || '—'}</p>
              </div>
              <div className="text-right shrink-0">
                {(r.lessonNumbers||[]).length > 0 && (
                  <span className="text-xs bg-indigo-50 text-indigo-500 font-bold px-1.5 py-0.5 rounded-full">第{r.lessonNumbers[0]}回</span>
                )}
                <p className="text-xs text-gray-300 mt-0.5">{fmtDate(r.savedAt||r.timestamp)}</p>
              </div>
            </div>
          ))}
          {logs.length > 80 && <p className="text-xs text-center text-gray-300 py-1">残り{logs.length-80}件 — CSVでエクスポートして確認</p>}
        </div>
      )}

      {/* 簡易統計 */}
      {logs.length > 0 && (() => {
        const ok = logs.filter(r=>r.quizResult==='ok').length;
        const ng = logs.filter(r=>r.quizResult==='ng').length;
        const pct = ok+ng > 0 ? Math.round(ok/(ok+ng)*100) : 0;
        return (
          <div className="grid grid-cols-3 gap-2">
            {[['✅ 正解', ok, 'bg-emerald-50 text-emerald-700'],['❌ 不正解', ng, 'bg-rose-50 text-rose-600'],['🎯 正答率', pct+'%', 'bg-indigo-50 text-indigo-700']].map(([l,v,c])=>(
              <div key={l} className={`rounded-xl p-3 text-center ${c}`}>
                <p className="text-lg font-black">{v}</p>
                <p className="text-xs font-bold">{l}</p>
              </div>
            ))}
          </div>
        );
      })()}
    </div>
  );
}

/* ─── 宿題チェックリスト ─── */
function HomeworkPanel() {
  const [hw, setHW] = React.useState(() => loadHW());
  // hw: { '1': { done:true, doneAt:'2024/01/15', note:'録音できた' }, ... }

  const toggle = (n) => {
    const prev = hw[n] || {};
    const updated = {...hw, [n]: prev.done
      ? {...prev, done:false, doneAt:''}
      : {...prev, done:true, doneAt:new Date().toLocaleDateString('ja-JP')}
    };
    setHW(updated); saveHW(updated);
  };
  const setNote = (n, note) => {
    const updated = {...hw, [n]: {...(hw[n]||{}), note}};
    setHW(updated); saveHW(updated);
  };

  const doneCount = CURRICULUM_CONTEXT.filter(l => hw[l.lesson]?.done).length;

  return (
    <div className="space-y-3">
      <div className="flex items-center justify-between">
        <div>
          <p className="text-sm font-black text-gray-700">🏠 宿題チェックリスト</p>
          <p className="text-xs text-gray-400">{doneCount} / {CURRICULUM_CONTEXT.length} 回 完了</p>
        </div>
        {/* 進捗バー */}
        <div className="w-24 h-2 bg-gray-100 rounded-full overflow-hidden">
          <div className="h-full bg-gradient-to-r from-emerald-400 to-teal-500 rounded-full transition-all duration-500"
            style={{width:`${Math.round(doneCount/CURRICULUM_CONTEXT.length*100)}%`}} />
        </div>
      </div>

      <div className="space-y-2">
        {CURRICULUM_CONTEXT.map(les => {
          const entry = hw[les.lesson] || {};
          const done = !!entry.done;
          return (
            <div key={les.lesson} className={`rounded-2xl border transition-colors ${done ? 'bg-emerald-50 border-emerald-200' : 'bg-white border-gray-100'}`}>
              <div className="flex items-start gap-3 px-3 py-3">
                <button onClick={() => toggle(les.lesson)}
                  className={`shrink-0 w-7 h-7 rounded-full border-2 flex items-center justify-center transition-all ${done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-gray-300 hover:border-emerald-400'}`}>
                  {done && <span className="text-sm font-black">✓</span>}
                </button>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className={`text-xs font-black w-5 h-5 rounded-full flex items-center justify-center text-white shrink-0 ${les.lesson <= 4 ? 'bg-blue-400' : 'bg-orange-400'}`}>{les.lesson}</span>
                    <span className={`text-xs font-bold ${done ? 'text-emerald-700' : 'text-gray-700'}`}>{les.titleJa}</span>
                    <span className="text-xs text-gray-400">{les.week}</span>
                  </div>
                  <p className="text-xs text-gray-500 mt-1 leading-relaxed">{les.hw}</p>
                  {done && entry.doneAt && (
                    <p className="text-xs text-emerald-500 mt-0.5">✅ {entry.doneAt} 完了</p>
                  )}
                  {/* メモ入力 */}
                  <input
                    type="text"
                    placeholder="メモを追加（任意）"
                    value={entry.note || ''}
                    onChange={e => setNote(les.lesson, e.target.value)}
                    className="mt-1.5 w-full text-xs border border-gray-200 rounded-lg px-2 py-1.5 focus:outline-none focus:border-purple-300 bg-white/80"
                  />
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ─── Google Sheets 連携 ─── */
const GAS_TEMPLATE = `// ① Googleスプレッドシートを開く → 拡張機能 → Apps Script
// ② 以下をそのまま貼り付けてデプロイ（ウェブアプリ/全員に公開）
// ③ デプロイURLをこのアプリに貼る

function doPost(e) {
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var payload = JSON.parse(e.postData.contents);

    if (payload.type === 'lesson_log') {
      var s = ss.getSheetByName('レッスンログ') || ss.insertSheet('レッスンログ');
      if (!s.getLastRow()) s.appendRow(['日時','入力文','文法','レベル','クイズ','結果','時間(秒)','学習回']);
      payload.records.forEach(function(r) {
        s.appendRow([r.timestamp,r.userInput,r.detectedGrammarName,r.level||'',r.quizAttempted?'○':'',r.quizResult||'',r.timeSpentSeconds||0,(r.lessonNumbers||[]).join('・')]);
      });
    } else if (payload.type === 'homework') {
      var h = ss.getSheetByName('宿題') || ss.insertSheet('宿題');
      if (!h.getLastRow()) h.appendRow(['回','テーマ','宿題内容','完了','完了日','メモ']);
      payload.records.forEach(function(r) {
        h.appendRow([r.lesson,r.theme,r.hw,r.done?'✅':'',r.doneAt||'',r.note||'']);
      });
    } else if (payload.type === 'knowledge_db') {
      var k = ss.getSheetByName('ナレッジ') || ss.insertSheet('ナレッジ');
      k.clearContents();
      k.appendRow(['ID','文法名','ローマ字','レベル','タグ','概要']);
      payload.records.forEach(function(r) {
        k.appendRow([r.id,r.name,r.romaji,r.level,r.tag_zh,r.summary_zh]);
      });
    }
    return ContentService.createTextOutput(JSON.stringify({status:'ok'}))
      .setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({status:'error',msg:err.message}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`;

function SheetsPanel({ db }) {
  const [url,     setUrl]     = React.useState(() => loadGasUrl());
  const [status,  setStatus]  = React.useState('');  // '' | 'sending' | 'ok' | 'err'
  const [gasOpen, setGasOpen] = React.useState(false);

  const saveUrl = (v) => { setUrl(v); saveGasUrl(v); };

  const send = async (type, label) => {
    if (!url.trim()) { setStatus('err_no_url'); return; }
    setStatus('sending');
    try {
      let records;
      if (type === 'lesson_log') records = loadLogs();
      else if (type === 'homework') {
        const hw = loadHW();
        records = CURRICULUM_CONTEXT.map(l => ({
          lesson: l.lesson, theme: l.titleJa, hw: l.hw,
          done: !!(hw[l.lesson]?.done), doneAt: hw[l.lesson]?.doneAt||'', note: hw[l.lesson]?.note||''
        }));
      } else if (type === 'knowledge_db') records = db;

      await fetch(url, { method:'POST', body: JSON.stringify({type, records}) });
      setStatus('ok_' + label);
      setTimeout(() => setStatus(''), 4000);
    } catch(e) {
      setStatus('err_' + e.message);
    }
  };

  const copyGas = () => {
    navigator.clipboard?.writeText(GAS_TEMPLATE)
      .then(() => { setStatus('copied'); setTimeout(()=>setStatus(''),2500); });
  };

  return (
    <div className="space-y-3">

/* ══════════════════════════════════════════════
   DOCX TEXT EXTRACTOR  v2
   ① EOCD から Central Directory を取得（data descriptor 対応）
   ② CD エントリで word/document.xml の正確な compSize・offset を特定
   ③ DecompressionStream('deflate-raw') で解凍、失敗時 'deflate' にフォールバック
   ④ <w:t> タグからテキスト抽出
   ══════════════════════════════════════════════ */
async function extractDocxText(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const view  = new DataView(arrayBuffer);

  /* ─ 1. EOCD を末尾から探す ─ */
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65558); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) return null;

  const cdCount  = view.getUint16(eocd + 10, true);
  const cdOffset = view.getUint32(eocd + 16, true);

  /* ─ 2. Central Directory を走査して word/document.xml を探す ─ */
  let cdPos = cdOffset;
  let tMethod = 0, tCompSize = 0, tLocalOff = 0, found = false;
  for (let i = 0; i < cdCount; i++) {
    if (view.getUint32(cdPos, true) !== 0x02014b50) break;
    const method     = view.getUint16(cdPos + 10, true);
    const compSize   = view.getUint32(cdPos + 20, true);
    const fnLen      = view.getUint16(cdPos + 28, true);
    const exLen      = view.getUint16(cdPos + 30, true);
    const cmLen      = view.getUint16(cdPos + 32, true);
    const localOff   = view.getUint32(cdPos + 42, true);
    const fname      = new TextDecoder().decode(bytes.subarray(cdPos + 46, cdPos + 46 + fnLen));
    if (fname === 'word/document.xml') {
      tMethod = method; tCompSize = compSize; tLocalOff = localOff; found = true; break;
    }
    cdPos += 46 + fnLen + exLen + cmLen;
  }
  if (!found) return null;

  /* ─ 3. ローカルヘッダーからデータ開始位置を計算 ─ */
  if (view.getUint32(tLocalOff, true) !== 0x04034b50) return null;
  const lFnLen   = view.getUint16(tLocalOff + 26, true);
  const lExLen   = view.getUint16(tLocalOff + 28, true);
  const dataStart = tLocalOff + 30 + lFnLen + lExLen;
  const compData  = bytes.subarray(dataStart, dataStart + tCompSize);

  /* ─ 4. 解凍 ─ */
  async function decompress(data, format) {
    const ds = new DecompressionStream(format);
    const w  = ds.writable.getWriter();
    const r  = ds.readable.getReader();
    w.write(data.slice()); w.close();
    const chunks = []; let done = false;
    while (!done) { const {value, done:d} = await r.read(); if (value) chunks.push(value); done = d; }
    const total = chunks.reduce((a, c) => a + c.length, 0);
    const out = new Uint8Array(total); let pos = 0;
    for (const c of chunks) { out.set(c, pos); pos += c.length; }
    return new TextDecoder('utf-8').decode(out);
  }

  let xmlText = '';
  if (tMethod === 0) {
    xmlText = new TextDecoder('utf-8').decode(compData);
  } else if (tMethod === 8 && typeof DecompressionStream !== 'undefined') {
    try       { xmlText = await decompress(compData, 'deflate-raw'); }
    catch (e) {
      try     { xmlText = await decompress(compData, 'deflate'); }
      catch   { return null; }
    }
  } else { return null; }

  /* ─ 5. <w:t> タグからテキスト抽出 ─ */
  if (!xmlText) return null;
  const texts = []; let m;
  const re = /<w:t[^>]*>([^<]*)<\/w:t>/g;
  while ((m = re.exec(xmlText)) !== null) if (m[1]) texts.push(m[1]);
  return texts.join(' ').trim() || null;
}

/* ── FileReader Promise ラッパー ── */
function readAsText(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = e => res(e.target.result);
    r.onerror = () => rej(new Error('read error'));
    r.readAsText(file, 'UTF-8');
  });
}
function readAsArrayBuffer(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = e => res(e.target.result);
    r.onerror = () => rej(new Error('read error'));
    r.readAsArrayBuffer(file);
  });
}

/* ── CSV テキスト → grammar entry 配列 ── */
function parseCsvToEntries(raw) {
  const lines  = raw.split('\n').map(l => l.trim()).filter(l => l);
  if (!lines.length) return [];
  const header = lines[0].split(',').map(h => h.replace(/^"|"$/g,'').trim());
  const rows   = lines.slice(1).map(l => {
    const vals = l.split(',').map(v => v.replace(/^"|"$/g,'').trim());
    const obj  = {}; header.forEach((h,i) => { obj[h] = vals[i] || ''; });
    return obj;
  }).filter(r => r.name || r['文法名']);
  return rows.map(r => ({
    id: r.id || r['ID'] || uid(),
    name: r.name || r['文法名'] || '',
    romaji: r.romaji || r['ローマ字'] || '',
    level: r.level || r['レベル'] || 'N5',
    pat_str: r.pat_str || r['パターン'] || '',
    tag_zh: r.tag_zh || r['タグ'] || '',
    summary_zh: r.summary_zh || r['概要'] || '',
    conj_rule: r.conj_rule || r['接続'] || '',
    conj_ex: r.conj_ex || '',
    detail_zh: r.detail_zh || r['解説'] || '',
    examples: [{ja:r.ex1_ja||r['例文1']||'',zh:r.ex1_zh||r['例文1訳']||''},{ja:r.ex2_ja||'',zh:r.ex2_zh||''}],
    quiz: {q_ja:r.q_ja||'',q_zh:r.q_zh||'',opts:[{id:'A',text:r.opt_a||'',correct:true},{id:'B',text:r.opt_b||'',correct:false}],ok_msg:'',ng_msg:''},
  }));
}

/* ── 1ファイル処理（フォルダモード用、Promiseを返す） ── */
async function processOneFile(file, db) {
  const name = file.name;
  const ext  = name.split('.').pop().toLowerCase();
  try {
    if (ext === 'json') {
      const raw  = await readAsText(file);
      const data = JSON.parse(raw);
      const arr  = Array.isArray(data) ? data : [data];
      if (!arr[0]?.name && !arr[0]?.id) return {name,ext,type:'error',msg:'name/idフィールドなし'};
      return {name,ext,type:'entries',entries:arr};
    }
    if (ext === 'csv') {
      const raw     = await readAsText(file);
      const entries = parseCsvToEntries(raw);
      if (!entries.length) return {name,ext,type:'error',msg:'name列が見つかりません'};
      return {name,ext,type:'entries',entries};
    }
    if (ext === 'txt' || ext === 'md') {
      const raw  = await readAsText(file);
      return {name,ext,type:'scan',scan:scanText(raw,db)};
    }
    if (ext === 'docx') {
      const buf  = await readAsArrayBuffer(file);
      const text = await extractDocxText(buf);
      if (!text || text.length < 5) return {name,ext,type:'error',msg:'テキスト抽出失敗'};
      return {name,ext,type:'scan',scan:scanText(text,db)};
    }
    if (ext === 'doc') return {name,ext,type:'legacyDoc'};
    if (['mp3','m4a','wav','ogg','aac'].includes(ext)) return {name,ext,type:'audio'};
    return {name,ext,type:'skip'};
  } catch(e) {
    return {name,ext,type:'error',msg:e.message};
  }
}

/* ── webkitEntry → File[] 再帰取得 ── */
async function getFilesFromEntry(entry) {
  if (entry.isFile) {
    return new Promise(res => entry.file(res, () => res(null)));
  }
  if (entry.isDirectory) {
    const reader = entry.createReader();
    const allEntries = await new Promise(res => {
      const acc = [];
      function batch() { reader.readEntries(items => { if (!items.length) { res(acc); return; } acc.push(...items); batch(); }); }
      batch();
    });
    const nested = await Promise.all(allEntries.map(getFilesFromEntry));
    return nested.flat().filter(Boolean);
  }
  return [];
}

function FileUploadPanel({ db, onFillForm, onBulkImport, onBack, showToast }) {

  const [fileInfo,     setFileInfo]     = React.useState(null);

  const [textScan,     setTextScan]     = React.useState(null);
  const [error,        setError]        = React.useState('');
  const [loading,      setLoading]      = React.useState(false);
  // フォルダ一括モード
  const [folderState,  setFolderState]  = React.useState(null);
  // null | { phase:'processing'|'done', n:number, total:number, current:string, results:[] }
  const inputRef       = React.useRef(null);
  const folderInputRef = React.useRef(null);

  const reset = () => {
    setFileInfo(null); setPreview(null); setTextScan(null);
    setError(''); setLoading(false); setFolderState(null);
  };

  /* ─── ファイル処理 ─── */
  const processFile = (file) => {
    setError(''); setPreview(null); setTextScan(null); setLoading(true);
    const name = file.name;
    const ext  = name.split('.').pop().toLowerCase();
    const reader = new FileReader();

    reader.onload = (e) => {

      } else if (ext === 'csv') {
        const lines = raw.split('\n').map(l => l.trim()).filter(l => l);
        const header = lines[0].split(',').map(h => h.replace(/^"|"$/g,'').trim());
        const rows = lines.slice(1).map(l => {
          // CSV simple parse (no nested quotes)
          const vals = l.split(',').map(v => v.replace(/^"|"$/g,'').trim());
          const obj = {};
          header.forEach((h,i) => { obj[h] = vals[i] || ''; });
          return obj;
        }).filter(r => r.name || r['文法名']);
        if (!rows.length) { setError('name列が見つかりません。ヘッダー行にnameまたは文法名が必要です'); return; }
        // CSV→grammar entry 変換
        const entries = rows.map(r => ({
          id:         r.id         || r['ID']   || uid(),
          name:       r.name       || r['文法名'] || '',
          romaji:     r.romaji     || r['ローマ字'] || '',
          level:      r.level      || r['レベル'] || 'N5',
          pat_str:    r.pat_str    || r['パターン'] || '',
          tag_zh:     r.tag_zh     || r['タグ']   || '',
          summary_zh: r.summary_zh || r['概要']   || '',
          conj_rule:  r.conj_rule  || r['接続']   || '',
          conj_ex:    r.conj_ex    || '',
          detail_zh:  r.detail_zh  || r['解説']   || '',
          examples:   [ {ja: r.ex1_ja||r['例文1']||'', zh: r.ex1_zh||r['例文1訳']||''}, {ja: r.ex2_ja||'', zh: r.ex2_zh||''} ],
          quiz:       { q_ja:r.q_ja||'', q_zh:r.q_zh||'', opts:[{id:'A',text:r.opt_a||'',correct:true},{id:'B',text:r.opt_b||'',correct:false}], ok_msg:'', ng_msg:'' },
        }));
        setFileInfo({ name, ext, size: file.size });
        setPreview(entries);

      } else if (ext === 'txt' || ext === 'md') {
        setFileInfo({ name, ext, size: file.size, rawText: raw });
        const result = scanText(raw, db);
        setTextScan(result);

      } else if (['mp3','m4a','wav','ogg','aac'].includes(ext)) {
        setFileInfo({ name, ext, size: file.size, isAudio: true });

      } else {
        setError(`非対応の形式: .${ext}　（対応: .json .csv .txt .docx .doc .mp3 .m4a .wav）`);
      }
    };

    reader.onerror = () => { setError('ファイル読み込みエラー'); setLoading(false); };

    if (['mp3','m4a','wav','ogg','aac'].includes(ext)) {
      setFileInfo({ name, ext, size: file.size, isAudio: true });
      setLoading(false);
    } else if (ext === 'docx') {
      // .docx は ArrayBuffer で読み込み → ZIP解析
      const abReader = new FileReader();
      abReader.onload = async (e) => {
        try {
          const text = await extractDocxText(e.target.result);
          if (!text || text.length < 5) {
            setError('Docxからテキストを抽出できませんでした。Word で「名前を付けて保存→.txt」に変換してから再アップしてください。');
            setLoading(false); return;
          }
          setFileInfo({ name, ext, size: file.size, rawText: text });
          setTextScan(scanText(text, db));
        } catch(err) {
          setError('Docx解析エラー: ' + err.message);
        }
        setLoading(false);
      };
      abReader.onerror = () => { setError('ファイル読み込みエラー'); setLoading(false); };
      abReader.readAsArrayBuffer(file);
    } else if (ext === 'doc') {
      // 旧バイナリ .doc は変換ガイドを表示
      setFileInfo({ name, ext, size: file.size, isLegacyDoc: true });
      setLoading(false);
    } else {
      reader.readAsText(file, 'UTF-8');
    }
  };

  /* ── フォルダ / 複数ファイル一括処理 ── */
  const SUPPORTED_EXTS = new Set(['json','csv','txt','md','docx','doc','mp3','m4a','wav','ogg','aac']);
  const processFolder = async (files) => {
    const list = Array.from(files).filter(f => SUPPORTED_EXTS.has(f.name.split('.').pop().toLowerCase()));
    if (!list.length) { setError('フォルダ内に対応ファイルが見つかりませんでした'); return; }
    reset();
    setFolderState({ phase:'processing', n:0, total:list.length, current:'', results:[] });
    const results = [];
    for (let i = 0; i < list.length; i++) {
      setFolderState(s => ({...s, n:i+1, current:list[i].name}));
      results.push(await processOneFile(list[i], db));
    }
    setFolderState({ phase:'done', n:list.length, total:list.length, current:'', results });
  };

  const onDrop = async (e) => {
    e.preventDefault(); setDragging(false);
    const items = e.dataTransfer.items;
    // ディレクトリドロップ検出
    if (items?.length) {
      const entry = items[0].webkitGetAsEntry?.();
      if (entry?.isDirectory) {
        const files = await getFilesFromEntry(entry);
        processFolder(files); return;
      }
      // 複数ファイルドロップ
      if (e.dataTransfer.files.length > 1) {
        processFolder(e.dataTransfer.files); return;
      }
    }
    const file = e.dataTransfer.files[0];
    if (file) processFile(file);
  };

  const fmtSize = (b) => b > 1024*1024 ? (b/1024/1024).toFixed(1)+'MB' : (b/1024).toFixed(0)+'KB';
  const extColor = { json:'bg-blue-100 text-blue-700', csv:'bg-green-100 text-green-700',
    txt:'bg-amber-100 text-amber-700', md:'bg-amber-100 text-amber-700',
    docx:'bg-indigo-100 text-indigo-700', doc:'bg-indigo-100 text-indigo-700',
    mp3:'bg-rose-100 text-rose-600', m4a:'bg-rose-100 text-rose-600', wav:'bg-rose-100 text-rose-600' };

  const bulkAdd = () => {
    if (!preview?.length) return;
    onBulkImport(preview);
    showToast(`📂 ${preview.length}件インポート完了！`);
    reset(); onBack();
  };

  const addOne = (entry) => {
    onFillForm(entry);
  };

  return (
    <div className="space-y-4">
      {/* ヘッダー */}
      <div className="flex items-center gap-2">
        <button onClick={onBack} className="text-xs text-purple-500 bg-purple-50 hover:bg-purple-100 px-3 py-1 rounded-full font-bold">← 戻る</button>
        <span className="text-sm font-black text-amber-600">📂 フォルダAL — アップロード</span>
      </div>

      {/* ドロップゾーン */}
      {!fileInfo && !folderState && (
        <div>
          {/* ドロップゾーン */}
          <div
            onDragOver={e=>{e.preventDefault();setDragging(true);}}
            onDragLeave={()=>setDragging(false)}
            onDrop={onDrop}
            className={`border-2 border-dashed rounded-3xl p-6 text-center transition-all ${dragging ? 'border-amber-400 bg-amber-50 scale-[1.01]' : 'border-gray-200 bg-gray-50'}`}>
            {/* hidden inputs */}
            <input ref={inputRef} type="file"
              accept=".json,.csv,.txt,.md,.doc,.docx,.mp3,.m4a,.wav,.ogg,.aac"
              className="hidden"
              onChange={e=>{ if(e.target.files[0]) processFile(e.target.files[0]); }} />
            <input ref={folderInputRef} type="file"
              /* webkitdirectory でフォルダ選択 */
              className="hidden" multiple
              onChange={e=>{ if(e.target.files?.length) processFolder(e.target.files); }}
              {...{webkitdirectory:'', directory:''}} />

            <div className="text-4xl mb-2">{dragging ? '⬇️' : '📂'}</div>
            <p className="font-black text-gray-600 mb-3">
              {dragging ? 'ここにドロップ！' : 'ファイル / フォルダをドロップ'}
            </p>
            {/* ボタン2つ */}
            <div className="flex gap-2 justify-center mb-3">
              <button onClick={()=>inputRef.current?.click()}
                className="flex items-center gap-1.5 bg-white border border-gray-200 hover:border-amber-400 hover:bg-amber-50 text-gray-600 text-xs font-bold px-4 py-2 rounded-xl transition-all shadow-sm">
                📄 ファイルを選ぶ
              </button>
              <button onClick={()=>folderInputRef.current?.click()}
                className="flex items-center gap-1.5 bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white text-xs font-black px-4 py-2 rounded-xl transition-all shadow-sm">
                📁 フォルダを選ぶ
              </button>
            </div>
            <p className="text-xs text-gray-400 leading-relaxed">
              <span className="font-bold text-blue-600">.json</span> ナレッジDB &nbsp;
              <span className="font-bold text-green-600">.csv</span> 文法リスト &nbsp;
              <span className="font-bold text-amber-600">.txt</span> テキスト解析 &nbsp;
              <span className="font-bold text-indigo-600">.docx/.doc</span> Word文書 &nbsp;
              <span className="font-bold text-rose-500">.mp3/.m4a</span> 音声
            </p>
          </div>
        </div>
      )}

      {loading && (
        <div className="text-center py-8">
          <div className="flex justify-center gap-2 mb-3"><span className="dot"/><span className="dot"/><span className="dot"/></div>
          <p className="text-sm text-gray-400">ファイルを読み込み中...</p>
        </div>
      )}

      {error && (
        <div className="bg-rose-50 border border-rose-200 rounded-2xl px-4 py-3 flex items-start gap-2">
          <span className="text-rose-400 text-lg shrink-0">⚠️</span>
          <div>
            <p className="text-sm font-bold text-rose-600">読み込みエラー</p>
            <p className="text-xs text-rose-500 mt-0.5">{error}</p>
          </div>
          <button onClick={reset} className="ml-auto text-rose-300 hover:text-rose-500 text-lg">✕</button>
        </div>
      )}

      {/* ファイル情報バッジ */}
      {fileInfo && (
        <div className="flex items-center gap-2 bg-white border border-gray-100 rounded-xl px-3 py-2.5 shadow-sm">
          <span className={`text-xs font-black px-2 py-1 rounded-lg ${extColor[fileInfo.ext] || 'bg-gray-100 text-gray-600'}`}>.{fileInfo.ext}</span>
          <span className="text-sm font-bold text-gray-700 flex-1 truncate">{fileInfo.name}</span>
          <span className="text-xs text-gray-400 shrink-0">{fmtSize(fileInfo.size)}</span>
          <button onClick={reset} className="text-gray-300 hover:text-gray-500 text-sm shrink-0">✕</button>
        </div>
      )}

      {/* ─── JSON / CSV プレビュー ─── */}
      {preview && (
        <div className="space-y-3">
          <div className="flex items-center justify-between">
            <p className="text-sm font-black text-gray-700">
              📋 {preview.length}件 プレビュー
              <span className="text-xs text-gray-400 font-normal ml-2">
                ({preview.filter(e=>db.find(d=>d.id===e.id)).length}件 重複・スキップ)
              </span>
            </p>
            <button onClick={bulkAdd}
              className="bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white text-xs font-black px-4 py-2 rounded-xl shadow-sm active:scale-[.97] transition-all">
              📥 全件インポート
            </button>
          </div>
          <div className="space-y-1.5 max-h-80 overflow-y-auto pr-1">
            {preview.map((e,i) => {
              const dup = !!db.find(d=>d.id===e.id);
              return (
                <div key={i} className={`flex items-center gap-2 rounded-xl border px-3 py-2.5 ${dup ? 'bg-gray-50 border-gray-100 opacity-50' : 'bg-white border-purple-100 shadow-sm'}`}>
                  <span className={`text-xs px-1.5 py-0.5 rounded-full font-bold shrink-0 ${LEVEL_COLOR[e.level]||'bg-gray-100 text-gray-500'}`}>{e.level||'?'}</span>
                  <div className="flex-1 min-w-0">
                    <p className="text-xs font-bold text-gray-700 truncate">{e.name}</p>
                    <p className="text-xs text-gray-400 truncate">{e.tag_zh || e.romaji}</p>
                  </div>
                  {dup ? (
                    <span className="text-xs text-gray-300 shrink-0 font-bold">重複</span>
                  ) : (
                    <button onClick={()=>addOne(e)}
                      className="shrink-0 text-xs bg-purple-500 hover:bg-purple-600 text-white px-2.5 py-1 rounded-lg font-bold transition-colors">
                      ＋
                    </button>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ─── TXT テキスト解析結果 ─── */}
      {textScan && (
        <div className="space-y-3">
          <p className="text-sm font-black text-gray-700">
            📄 テキスト解析結果 — {textScan.total}文・{textScan.found.length}件検出
          </p>
          {textScan.found.length > 0 && (
            <div className="space-y-1.5">
              <p className="text-xs text-gray-400 font-bold">✅ ナレッジ登録済み</p>
              {textScan.found.map((f,i)=>(
                <div key={i} className="bg-emerald-50 border border-emerald-100 rounded-xl px-3 py-2 flex items-center gap-2">
                  <span className={`text-xs px-1.5 py-0.5 rounded-full font-bold shrink-0 ${LEVEL_COLOR[f.grammar.level]}`}>{f.grammar.level}</span>
                  <span className="text-xs font-bold text-emerald-700 flex-1 truncate">{f.grammar.name}</span>
                  <span className="text-xs text-emerald-400">{f.sentences.length}文</span>
                </div>
              ))}
            </div>
          )}
          {textScan.cands.length > 0 && (
            <div className="space-y-1.5">
              <p className="text-xs text-gray-400 font-bold">💡 未登録の候補</p>
              {textScan.cands.map((c,i)=>(
                <div key={i} className="bg-amber-50 border border-amber-100 rounded-xl px-3 py-2 flex items-center gap-2">
                  <span className={`text-xs px-1.5 py-0.5 rounded-full font-bold shrink-0 ${LEVEL_COLOR[c.hint.level]}`}>{c.hint.level}</span>
                  <div className="flex-1 min-w-0">
                    <p className="text-xs font-bold text-amber-700 truncate">{c.hint.name}</p>
                    <p className="text-xs text-amber-500">{c.hint.tag_zh}</p>
                  </div>
                  <button onClick={()=>onFillForm({name:c.hint.name,romaji:c.hint.romaji,level:c.hint.level,tag_zh:c.hint.tag_zh,pat_str:c.hint.pat_str})}
                    className="shrink-0 text-xs bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1 rounded-lg font-bold transition-colors">
                    追加
                  </button>
                </div>
              ))}
            </div>
          )}
          {textScan.found.length===0 && textScan.cands.length===0 && (
            <div className="bg-gray-50 rounded-2xl border border-dashed border-gray-200 p-6 text-center">
              <p className="text-xs text-gray-400">文法パターンが検出されませんでした。<br/>日本語テキストを含むファイルを選んでください。</p>
            </div>
          )}
        </div>
      )}

      {/* ─── 音声ファイル案内 ─── */}
      {fileInfo?.isAudio && (
        <div className="bg-rose-50 border border-rose-200 rounded-2xl p-5 text-center space-y-3">
          <div className="text-4xl">🎵</div>
          <p className="text-sm font-black text-rose-700">{fileInfo.name}</p>
          <p className="text-xs text-gray-500 leading-relaxed">
            音声ファイルはブラウザのWeb Speech APIで直接再生・文字起こしできません。<br/>
            下の手順で文法を抽出してください。
          </p>
          <div className="bg-white rounded-xl border border-rose-100 p-3 text-left space-y-1.5">
            {[
              '① 音声ファイルをスマホ/PCのプレーヤーで再生',
              '② このアプリの「🎤 音声文字起こし」タブに切り替え',
              '③ マイク録音で音声を流しながら同時録音 → 文法抽出',
            ].map((s,i)=>(
              <p key={i} className="text-xs text-gray-600">{s}</p>
            ))}
          </div>
          <button onClick={()=>{reset(); onBack();}}
            className="w-full bg-rose-500 hover:bg-rose-600 text-white text-xs font-black py-2.5 rounded-xl transition-colors">
            🎤 音声文字起こしに切り替える
          </button>
        </div>
      )}

      {/* ═══ フォルダ一括処理 ═══ */}
      {folderState?.phase === 'processing' && (
        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-5 space-y-3">
          <div className="flex items-center gap-2">
            <div className="w-5 h-5 border-2 border-amber-400 border-t-transparent rounded-full animate-spin shrink-0"/>
            <p className="text-sm font-black text-amber-700">フォルダを読み込み中...</p>
          </div>
          <div className="w-full bg-amber-100 rounded-full h-2">
            <div className="bg-amber-400 h-2 rounded-full transition-all"
              style={{width: `${(folderState.n/folderState.total)*100}%`}}/>
          </div>
          <p className="text-xs text-amber-600">
            {folderState.n} / {folderState.total} ファイル処理中
            {folderState.current && <span className="ml-2 text-amber-400 truncate">— {folderState.current}</span>}
          </p>
        </div>
      )}

      {folderState?.phase === 'done' && (()=>{
        const results   = folderState.results;
        const allEntries= results.filter(r=>r.type==='entries').flatMap(r=>r.entries);
        const scanned   = results.filter(r=>r.type==='scan');
        const allFound  = scanned.flatMap(r=>r.scan.found);
        const allCands  = scanned.flatMap(r=>r.scan.cands);
        // grammarId重複排除
        const uniqFound = allFound.filter((f,i)=>allFound.findIndex(x=>x.grammar.id===f.grammar.id)===i);
        const uniqCands = allCands.filter((c,i)=>allCands.findIndex(x=>x.hint.name===c.hint.name)===i);
        const audioCount  = results.filter(r=>r.type==='audio').length;
        const docCount    = results.filter(r=>r.type==='legacyDoc').length;
        const errCount    = results.filter(r=>r.type==='error').length;
        const skipCount   = results.filter(r=>r.type==='skip').length;

        const bulkAllEntries = () => {
          if (!allEntries.length) return;
          onBulkImport(allEntries);
          showToast(`📁 ${allEntries.length}件インポート完了！`);
          reset(); onBack();
        };

        return (
          <div className="space-y-4">
            {/* サマリーヘッダー */}
            <div className="bg-gradient-to-r from-amber-400 to-orange-500 rounded-2xl p-4 text-white">
              <div className="flex items-center justify-between mb-2">
                <p className="font-black text-base">📁 フォルダ読み込み完了</p>
                <button onClick={reset} className="text-white/70 hover:text-white text-sm">✕ リセット</button>
              </div>
              <div className="grid grid-cols-4 gap-2 text-center">
                {[
                  {v:folderState.total, l:'総ファイル'},
                  {v:allEntries.length, l:'文法エントリ'},
                  {v:scanned.length,    l:'テキスト解析'},
                  {v:errCount+skipCount+audioCount+docCount, l:'スキップ'},
                ].map(({v,l})=>(
                  <div key={l} className="bg-white/20 rounded-xl py-1.5">
                    <p className="text-lg font-black">{v}</p>
                    <p className="text-xs opacity-80">{l}</p>
                  </div>
                ))}
              </div>
            </div>

            {/* ─ JSON/CSV エントリ ─ */}
            {allEntries.length > 0 && (
              <div className="space-y-2">
                <div className="flex items-center justify-between">
                  <p className="text-sm font-black text-gray-700">📋 文法エントリ — {allEntries.length}件</p>
                  <button onClick={bulkAllEntries}
                    className="bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white text-xs font-black px-4 py-1.5 rounded-xl shadow-sm">
                    📥 全件インポート
                  </button>
                </div>
                <div className="space-y-1 max-h-40 overflow-y-auto pr-1">
                  {allEntries.map((e,i)=>{
                    const dup = !!db.find(d=>d.id===e.id);
                    return (
                      <div key={i} className={`flex items-center gap-2 rounded-xl border px-3 py-2 ${dup?'bg-gray-50 opacity-50':'bg-white border-purple-100'}`}>
                        <span className={`text-xs px-1.5 py-0.5 rounded-full font-bold shrink-0 ${LEVEL_COLOR[e.level]||'bg-gray-100 text-gray-500'}`}>{e.level||'?'}</span>
                        <span className="text-xs font-bold text-gray-700 flex-1 truncate">{e.name}</span>
                        {dup ? <span className="text-xs text-gray-300 font-bold">重複</span>
                             : <button onClick={()=>{ onFillForm(e); }}
                                 className="text-xs bg-purple-500 text-white px-2 py-0.5 rounded-lg font-bold">＋</button>}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ─ テキストスキャン結果 ─ */}
            {scanned.length > 0 && (
              <div className="space-y-2">
                <p className="text-sm font-black text-gray-700">
                  📄 テキスト解析 — {scanned.length}ファイル / ✅{uniqFound.length}件登録済み / 💡{uniqCands.length}件候補
                </p>
                {uniqFound.length > 0 && (
                  <div className="space-y-1 max-h-32 overflow-y-auto">
                    {uniqFound.map((f,i)=>(
                      <div key={i} className="bg-emerald-50 border border-emerald-100 rounded-xl px-3 py-2 flex items-center gap-2">
                        <span className={`text-xs px-1.5 py-0.5 rounded-full font-bold ${LEVEL_COLOR[f.grammar.level]}`}>{f.grammar.level}</span>
                        <span className="text-xs font-bold text-emerald-700 flex-1 truncate">{f.grammar.name}</span>
                        <span className="text-xs text-emerald-400">{f.sentences.length}文</span>
                      </div>
                    ))}
                  </div>
                )}
                {uniqCands.length > 0 && (
                  <div className="space-y-1 max-h-32 overflow-y-auto">
                    <p className="text-xs text-gray-400 font-bold">💡 未登録の候補</p>
                    {uniqCands.map((c,i)=>(
                      <div key={i} className="bg-amber-50 border border-amber-100 rounded-xl px-3 py-2 flex items-center gap-2">
                        <span className={`text-xs px-1.5 py-0.5 rounded-full font-bold ${LEVEL_COLOR[c.hint.level]}`}>{c.hint.level}</span>
                        <span className="text-xs font-bold text-amber-700 flex-1 truncate">{c.hint.name}</span>
                        <button onClick={()=>onFillForm({name:c.hint.name,romaji:c.hint.romaji,level:c.hint.level,tag_zh:c.hint.tag_zh,pat_str:c.hint.pat_str})}
                          className="text-xs bg-amber-500 text-white px-2 py-0.5 rounded-lg font-bold">追加</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* ─ ファイル一覧 ─ */}
            <details className="bg-gray-50 rounded-2xl border border-gray-100">

}

function URLFetchPanel({ db, onFillForm, onBack }) {
  const [url,      setUrl]      = useState('');
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState('');
  const [rawText,  setRawText]  = useState('');
  const [results,  setResults]  = useState(null);

  const doFetch = async () => {
    if (!url.trim()) return;
    setLoading(true); setError(''); setRawText(''); setResults(null);
    try {
      const text = await fetchPageText(url);
      if (!text || text.length < 30) throw new Error('テキストを取得できませんでした');
      setRawText(text);
      setResults(scanText(text, db));
    } catch(e) {
      setError('取得失敗: ' + (e.message || 'ネットワークエラー'));
    }
    setLoading(false);
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center gap-2 mb-1">
        <button onClick={onBack} className="text-xs text-purple-500 bg-purple-50 hover:bg-purple-100 px-3 py-1 rounded-full transition-colors font-bold">← 戻る</button>
        <span className="text-sm font-black text-emerald-700">🌐 URL取得</span>
      </div>

      <div className="bg-white rounded-2xl border border-emerald-100 p-4 shadow-sm">
        <label className="form-label">WebサイトのURLを入力</label>
        <input className="form-input mb-2" placeholder="https://..." value={url} onChange={e=>{setUrl(e.target.value);setError('');}} />
        <p className="text-xs text-gray-400 mb-3">💡 例：</p>
        <div className="flex flex-wrap gap-1.5 mb-3">
          {SAMPLE_URLS.map((u,i) => (
            <button key={i} onClick={()=>setUrl(u)} className="chip text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-1 rounded-lg truncate max-w-full">{u}</button>
          ))}
        </div>
        <button onClick={doFetch} disabled={!url.trim() || loading}
          className="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 disabled:opacity-40 text-white font-black py-3 rounded-2xl transition-all shadow-md text-sm">
          {loading
            ? <span className="flex items-center justify-center gap-2">取得中...<span className="dot"/><span className="dot"/><span className="dot"/></span>
            : '🌐 テキストを取得して解析'}
        </button>
        {error && <p className="text-xs text-rose-500 mt-2 bg-rose-50 rounded-xl px-3 py-2">{error}</p>}
      </div>

      {/* 取得テキストのプレビュー */}
      {rawText && !loading && (
        <details className="bg-gray-50 border border-gray-200 rounded-2xl p-3 text-xs text-gray-400">
          <summary className="cursor-pointer font-bold select-none">📄 取得テキストのプレビュー ({rawText.length.toLocaleString()}文字)</summary>
          <p className="mt-2 whitespace-pre-wrap line-clamp-10 text-gray-500">{rawText.slice(0,800)}{rawText.length>800?'...':''}</p>
        </details>
      )}

      {results && <AnalyzeResults results={results} onFillForm={onFillForm} />}
    </div>
  );
}

/* ══════════════════════════════════════════════
   ANALYZE RESULTS — 解析結果カード
   ══════════════════════════════════════════════ */
function AnalyzeResults({ results, onFillForm }) {
  const { found, cands, total } = results;
  const empty = found.length === 0 && cands.length === 0;

  return (
    <div className="space-y-3 fiu">
      {/* サマリー */}
      <div className="bg-indigo-50 border border-indigo-100 rounded-2xl px-4 py-3 flex items-center gap-3">
        <span className="text-2xl">📊</span>
        <div className="text-xs">
          <p className="font-black text-indigo-700">解析完了 · {total}文を検索</p>
          <p className="text-indigo-400">既知の文法 <strong>{found.length}件</strong> 検出 ／ 未登録の候補 <strong>{cands.length}件</strong> 発見</p>
        </div>
      </div>

      {empty && (
        <div className="text-center py-8 text-gray-400">
          <div className="text-3xl mb-2">🔎</div>
          <p className="text-sm">文法パターンが検出されませんでした<br/>別のテキストをお試しください</p>

      )}

      {/* ✅ 既知の文法 */}
      {found.length > 0 && (
        <div>
          <p className="text-xs font-black text-emerald-600 mb-2">✅ 既登録の文法が検出されました（例文候補）</p>
          {found.map(({grammar, sentences}) => (
            <div key={grammar.id} className="bg-white border border-emerald-100 rounded-2xl p-4 mb-2 shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <div>
                  <span className={`text-xs font-bold px-2 py-0.5 rounded-full mr-1 ${LEVEL_COLOR[grammar.level]||'bg-gray-100 text-gray-600'}`}>{grammar.level}</span>
                  <span className="font-bold text-gray-700 text-sm">{grammar.name}</span>
                </div>
                <button onClick={()=>onFillForm({...grammar, examples:[{ja:sentences[0]||'',zh:''},{ja:sentences[1]||grammar.examples?.[1]?.ja||'',zh:grammar.examples?.[1]?.zh||''}]})}
                  className="text-xs bg-emerald-500 hover:bg-emerald-600 text-white px-2.5 py-1 rounded-lg font-bold transition-colors">
                  例文を更新
                </button>
              </div>
              {sentences.slice(0,2).map((s,i) => (
                <p key={i} className="text-xs text-gray-500 bg-emerald-50 rounded-lg px-3 py-1.5 mb-1">「{s}」</p>
              ))}
            </div>
          ))}
        </div>
      )}

      {/* 🔍 未登録の候補 */}
      {cands.length > 0 && (
        <div>
          <p className="text-xs font-black text-amber-600 mb-2">🔍 未登録の文法候補 — 新しくナレッジに追加できます</p>
          {cands.map(({hint, sentences}) => (
            <div key={hint.pat_str} className="bg-white border border-amber-200 rounded-2xl p-4 mb-2 shadow-sm">
              <div className="flex items-start justify-between gap-2 mb-2">
                <div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${LEVEL_COLOR[hint.level]||'bg-gray-100 text-gray-600'}`}>{hint.level}</span>
                    <span className="font-black text-amber-700 text-sm">{hint.name}</span>
                    <span className="text-xs text-gray-400">{hint.romaji}</span>
                  </div>
                  <p className="text-xs text-gray-500 mt-0.5">{hint.tag_zh}</p>
                </div>
                <button onClick={()=>onFillForm({
                  id:'', name:hint.name, romaji:hint.romaji, level:hint.level,
                  pat_str:hint.pat_str, tag_zh:hint.tag_zh,
                  summary_zh:'', conj_rule:'', conj_ex:'', detail_zh:'',
                  examples:[{ja:sentences[0]||'',zh:''},{ja:sentences[1]||'',zh:''}],
                  quiz:{q_ja:'',q_zh:'',opts:[{id:'A',text:'',correct:true},{id:'B',text:'',correct:false}],ok_msg:'',ng_msg:''},
                })}
                  className="text-xs bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-colors shrink-0">
                  🧠 追加フォームへ
                </button>
              </div>
              {sentences.slice(0,2).map((s,i) => (
                <p key={i} className="text-xs text-gray-500 bg-amber-50 rounded-lg px-3 py-1.5 mb-1">「{s}」</p>
              ))}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════
   AUDIO TRANSCRIBE PANEL — 🎤 音声文字起こし
   ══════════════════════════════════════════════ */
function AudioTranscribePanel({ db, onFillForm, onBack }) {
  const [transcript,  setTranscript]  = useState('');
  const [interim,     setInterim]     = useState('');
  const [isListening, setIsListening] = useState(false);
  const [results,     setResults]     = useState(null);
  const [scanning,    setScanning]    = useState(false);
  const [error,       setError]       = useState('');
  const [mode,        setMode]        = useState(null); // null | 'mic' | 'paste'
  const recRef = useRef(null);

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micSupported = !!SR;

  const startListening = () => {
    if (!SR) { setError('このブラウザは音声認識に対応していません（Chrome推奨）'); return; }
    try {
      const rec = new SR();
      rec.lang = 'ja-JP';
      rec.continuous = true;
      rec.interimResults = true;
      rec.onresult = (e) => {
        let fin = '';
        let inter = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) fin += e.results[i][0].transcript;
          else inter += e.results[i][0].transcript;
        }
        if (fin) setTranscript(t => t + fin + (fin.slice(-1).match(/[。！？]/) ? '' : '。'));
        setInterim(inter);
      };
      rec.onerror = (e) => {
        setError('音声認識エラー: ' + e.error);
        setIsListening(false);
        setInterim('');
      };
      rec.onend = () => { setIsListening(false); setInterim(''); };
      rec.start();
      recRef.current = rec;
      setIsListening(true);
      setError('');
      setResults(null);
    } catch(e) { setError('起動失敗: ' + e.message); }
  };

  const stopListening = () => {
    recRef.current?.stop();
    setIsListening(false);
    setInterim('');
  };

  const clearAll = () => {
    stopListening();
    setTranscript(''); setInterim(''); setResults(null); setError('');
  };

  const doScan = () => {
    const text = (transcript + ' ' + interim).trim();
    if (!text) return;
    setScanning(true);
    setTimeout(() => { setResults(scanText(text, db)); setScanning(false); }, 500);
  };

  const fullText = transcript + (interim ? '…' + interim : '');

  return (
    <div className="space-y-4">
      <div className="flex items-center gap-2 mb-1">
        <button onClick={onBack} className="text-xs text-purple-500 bg-purple-50 hover:bg-purple-100 px-3 py-1 rounded-full transition-colors font-bold">← 戻る</button>
        <span className="text-sm font-black text-rose-600">🎤 音声文字起こし</span>
      </div>

      {/* ── モード選択 ── */}
      {!mode && (
        <div className="space-y-3 fiu">
          {/* booco連携バナー */}
          <div className="bg-gradient-to-r from-purple-500 to-violet-600 rounded-2xl px-4 py-3 shadow-md">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-2">
                <span className="text-xl">🔄</span>
                <span className="font-black text-white text-sm">booco連携モード</span>
              </div>
              <a href={BOOCO_LINKS.web} target="_blank" rel="noopener noreferrer"
                className="shrink-0 bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-3 py-1.5 rounded-full transition-colors">
                📱 boocoを開く ↗
              </a>
            </div>
            <div className="flex items-start gap-2">
              <div className="flex gap-1 mt-0.5">
                {['1','2','3'].map(n => (
                  <span key={n} className="bg-white/20 text-white text-xs font-black w-5 h-5 rounded-full flex items-center justify-center shrink-0">{n}</span>
                ))}
              </div>
              <p className="text-purple-100 text-xs leading-relaxed">
                boocoで音声を再生 → このアプリに戻る → 下の「マイク録音」をタップして同時録音 → 文法を自動抽出
              </p>
            </div>
          </div>

          <div className="text-center py-1">
            <p className="text-sm font-black text-gray-700">録音方法を選んでください</p>
            <p className="text-xs text-gray-400 mt-0.5">音声から文法を自動抽出します</p>
          </div>
          {micSupported ? (
            <button onClick={()=>setMode('mic')}
              className="w-full bg-gradient-to-r from-pink-400 to-rose-500 text-white rounded-2xl p-4 text-left shadow-md hover:shadow-lg active:scale-[.98] transition-all">
              <div className="flex items-center gap-4">
                <span className="text-3xl bg-white/20 rounded-xl w-12 h-12 flex items-center justify-center">🎙️</span>
                <div>
                  <p className="font-black text-base">マイク録音（リアルタイム）</p>
                  <p className="text-white/80 text-xs mt-0.5">ブラウザが日本語を自動文字起こし</p>
                </div>
              </div>
            </button>
          ) : (
            <div className="bg-gray-50 border border-gray-200 rounded-2xl p-4 text-center text-xs text-gray-400">
              🚫 このブラウザはマイク認識に非対応です（Chrome推奨）
            </div>
          )}
          <button onClick={()=>setMode('paste')}
            className="w-full bg-gradient-to-r from-indigo-400 to-blue-500 text-white rounded-2xl p-4 text-left shadow-md hover:shadow-lg active:scale-[.98] transition-all">
            <div className="flex items-center gap-4">
              <span className="text-3xl bg-white/20 rounded-xl w-12 h-12 flex items-center justify-center">📋</span>
              <div>
                <p className="font-black text-base">文字起こし貼り付け</p>
                <p className="text-white/80 text-xs mt-0.5">Whisper等の起こしテキストを貼付</p>
              </div>
            </div>
          </button>
          {/* ヒント */}
          <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-xs text-amber-700">
            <p className="font-bold mb-1">💡 使い方のコツ</p>
            <p>①みんなの日本語などのテキスト音声を流しながら「マイク録音」でリアルタイム文字起こし</p>
            <p className="mt-1">② ChatGPT / Whisper で文字起こしたテキストを「貼り付け」してもOK</p>
          </div>
        </div>
      )}

      {/* ── マイク録音モード ── */}
      {mode === 'mic' && (
        <div className="space-y-3 fiu">
          <button onClick={()=>{clearAll();setMode(null);}} className="text-xs text-gray-400 hover:text-gray-600">← モード選択に戻る</button>

          {/* booco クイックアクセス */}
          <div className="flex items-center gap-2 bg-purple-50 border border-purple-200 rounded-xl px-3 py-2">
            <span className="text-base">📱</span>
            <p className="text-xs text-purple-700 flex-1 font-medium">boocoで音声を流しながら録音しよう！</p>
            <a href={BOOCO_LINKS.web} target="_blank" rel="noopener noreferrer"
              className="shrink-0 text-xs bg-purple-500 hover:bg-purple-600 text-white px-2.5 py-1 rounded-lg font-bold transition-colors">
              開く↗
            </a>
          </div>

          {/* 録音ボタン */}
          <div className="bg-white rounded-2xl border border-rose-100 p-4 shadow-sm text-center">
            {!isListening ? (
              <button onClick={startListening}
                className="bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-black px-8 py-4 rounded-2xl text-lg shadow-lg hover:shadow-xl active:scale-[.98] transition-all">
                🎙️ 録音開始
              </button>
            ) : (
              <button onClick={stopListening}
                className="bg-red-500 hover:bg-red-600 text-white font-black px-8 py-4 rounded-2xl text-lg shadow-lg animate-pulse transition-all">
                ⏹ 録音停止
              </button>
            )}
            {isListening && (
              <p className="text-xs text-rose-400 mt-3 flex items-center justify-center gap-1">
                <span className="dot"/> <span className="dot"/> <span className="dot"/>
                <span className="ml-1">日本語を聴き取り中...</span>
              </p>
            )}
            {error && <p className="text-xs text-red-500 mt-2 bg-red-50 rounded-xl px-3 py-2">{error}</p>}
          </div>

          {/* 文字起こし表示 */}
          {(fullText || isListening) && (
            <div className="bg-white rounded-2xl border border-indigo-100 p-4 shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <p className="text-xs font-black text-indigo-600">📝 文字起こし結果</p>
                <button onClick={clearAll} className="text-xs text-gray-400 hover:text-gray-600 bg-gray-100 px-2 py-0.5 rounded-lg">クリア</button>
              </div>
              <div className="min-h-[80px] bg-indigo-50 rounded-xl p-3 text-sm leading-relaxed">
                <span className="text-gray-700">{transcript}</span>
                {interim && <span className="text-indigo-300 italic">{interim}</span>}
                {!fullText && <span className="text-gray-300 text-xs">（録音中に音声を検出すると、ここに表示されます）</span>}
              </div>
            </div>
          )}

          {/* 解析ボタン */}
          {transcript && !isListening && (
            <button onClick={doScan} disabled={scanning}
              className="w-full bg-gradient-to-r from-violet-500 to-purple-600 hover:from-violet-600 hover:to-purple-700 disabled:opacity-40 text-white font-black py-3 rounded-2xl shadow-md transition-all text-sm">
              {scanning ? '🔍 解析中...' : '🔍 文法を解析してナレッジ候補を抽出'}
            </button>
          )}
        </div>
      )}

      {/* ── 貼り付けモード ── */}
      {mode === 'paste' && (
        <div className="space-y-3 fiu">
          <button onClick={()=>{clearAll();setMode(null);}} className="text-xs text-gray-400 hover:text-gray-600">← モード選択に戻る</button>
          <div className="bg-white rounded-2xl border border-blue-100 p-4 shadow-sm">
            <label className="form-label">文字起こしテキストを貼り付けてください</label>
            <textarea className="form-input" rows={8}
              placeholder={"テキスト音声の文字起こし例：\n「田中さんはどこから来ましたか。\n私は中国から来ました。\nはじめまして、どうぞよろしく。\n駅はどこにありますか。\n電車で10分ぐらいです。」"}
              value={transcript} onChange={e=>{setTranscript(e.target.value);setResults(null);}} />
            <button onClick={doScan} disabled={!transcript.trim() || scanning}
              className="w-full mt-3 bg-gradient-to-r from-blue-500 to-indigo-500 hover:from-blue-600 hover:to-indigo-600 disabled:opacity-40 text-white font-black py-3 rounded-2xl transition-all shadow-md text-sm">
              {scanning ? '🔍 解析中...' : '🔍 文法を解析する'}
            </button>
          </div>
        </div>
      )}

      {/* ── 解析結果 ── */}
      {results && <AnalyzeResults results={results} onFillForm={onFillForm} />}
    </div>
  );
}

   SCREEN: ANALYSIS
   ══════════════════════════════════════════════ */
function AnalysisScreen({ grammar, onQuiz }) {
  const lessons = LESSON_MAP[grammar.id] || [];
  return (
    <div className="space-y-4">
      <div className="fiu bg-gradient-to-br from-purple-500 via-indigo-500 to-blue-500 rounded-3xl p-6 text-white shadow-xl">
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2 flex-wrap">
            <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold ${LEVEL_COLOR[grammar.level]||'bg-white/20 text-white'}`}>{grammar.level}</span>
            {lessons.length > 0 && (
              <span className="text-xs px-2 py-0.5 rounded-full font-bold bg-white/20 text-white">
                📅 第{lessons.join('・')}回で学習
              </span>
            )}
          </div>
          <span className="text-2xl">📚</span>
        </div>
        <p className="text-purple-200 text-xs mb-1">検出された文法 / 检测到的语法</p>
        <h2 className="text-3xl font-black mb-1 tracking-tight">{grammar.name}</h2>
        <p className="text-purple-300 text-xs mb-3">{grammar.romaji}</p>
        <div className="bg-white/15 backdrop-blur rounded-2xl px-4 py-3">
          <p className="font-bold text-lg">{grammar.tag_zh}</p>
          <p className="text-purple-200 text-xs mt-0.5">{grammar.summary_zh}</p>
        </div>
      </div>
      <div className="fiu1 bg-white rounded-3xl shadow-sm p-6 border border-indigo-100">
        <h3 className="font-bold text-indigo-700 mb-3 text-sm flex items-center gap-1.5"><span>🔧</span> 接続方式 / 接续方式</h3>
        <div className="bg-indigo-50 rounded-2xl p-4">
          <p className="text-indigo-700 font-bold text-sm mb-1">{grammar.conj_rule}</p>
          <p className="text-indigo-500 text-sm">例：{grammar.conj_ex}</p>
        </div>
      </div>
      <div className="fiu2 bg-white rounded-3xl shadow-sm p-6 border border-purple-100">
        <h3 className="font-bold text-purple-700 mb-3 text-sm flex items-center gap-1.5"><span>🧠</span> 文法解説 / 语法讲解</h3>
        <p className="text-gray-600 text-sm leading-relaxed">{grammar.detail_zh}</p>
      </div>
      {/* 授業でのポイント（カリキュラムヒント） */}
      {lessons.length > 0 && (() => {
        const les = CURRICULUM_CONTEXT.find(l => l.lesson === lessons[0]);
        return les ? (
          <div className="fiu2 bg-amber-50 rounded-3xl shadow-sm p-5 border border-amber-100">
            <h3 className="font-bold text-amber-700 mb-2 text-sm flex items-center gap-1.5">
              <span>🇨🇳</span> 中国語話者向けの学習ポイント
              <span className="text-xs bg-amber-200 text-amber-700 px-2 py-0.5 rounded-full font-bold ml-auto">第{les.lesson}回</span>
            </h3>
            <p className="text-amber-800 text-sm leading-relaxed">{les.cn_tip}</p>
          </div>
        ) : null;
      })()}
      <div className="fiu3 bg-white rounded-3xl shadow-sm p-6 border border-amber-100">
        <h3 className="font-bold text-amber-600 mb-3 text-sm flex items-center gap-1.5"><span>✍️</span> 例文 / 例句</h3>
        <div className="space-y-3">
          {grammar.examples.map((ex,i) => (
            <div key={i} className="bg-amber-50 rounded-2xl p-4 border border-amber-100">
              <p className="text-gray-800 font-bold text-base mb-1">{ex.ja}</p>
              <p className="text-amber-600 text-sm">{ex.zh}</p>
            </div>
          ))}
        </div>
      </div>
      <div className="fiu4">
        <button onClick={onQuiz} className="w-full bg-gradient-to-r from-rose-500 to-orange-400 hover:from-rose-600 hover:to-orange-500 text-white font-black py-4 rounded-2xl transition-all shadow-md hover:shadow-xl active:scale-[.98]">
          🎯 クイズに挑戦！→ 挑战练习题！
        </button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   SCREEN: QUIZ
   ══════════════════════════════════════════════ */
function QuizScreen({ grammar, selected, result, pick, reset, log }) {
  const quiz = grammar.quiz;
  return (
    <div className="space-y-4">
      <div className="fiu text-center py-3">
        <div className="text-4xl mb-2">🎯</div>
        <h2 className="text-xl font-black text-gray-700">穴埋めクイズ / 填空练习</h2>
        <p className="text-sm text-gray-400 mt-1">正しい答えを選んでください</p>
      </div>
      <div className="fiu1 bg-white rounded-3xl shadow-sm p-6 border border-purple-100">
        <span className="inline-block bg-purple-100 text-purple-600 text-xs font-bold px-3 py-1 rounded-full mb-4">{grammar.name}</span>
        <p className="text-gray-400 text-sm mb-2">{quiz.q_zh}</p>
        <p className="text-2xl font-black text-gray-800 leading-relaxed">{quiz.q_ja}</p>
      </div>
      <div className="fiu2 grid grid-cols-2 gap-3">
        {quiz.opts.map(opt => {
          let cls = 'bg-white border-2 border-gray-200 text-gray-700';
          if (selected===opt.id) cls = opt.correct ? 'bg-emerald-50 border-2 border-emerald-400 text-emerald-700' : 'bg-rose-50 border-2 border-rose-300 text-rose-600';
          else if (selected && opt.correct) cls = 'bg-emerald-50 border-2 border-emerald-300 text-emerald-600 opacity-60';
          return (
            <button key={opt.id} onClick={()=>pick(opt)} disabled={!!selected}
              className={`opt-card ${cls} rounded-2xl p-5 text-center shadow-sm disabled:cursor-default`}>
              <div className="text-3xl font-black mb-1 opacity-40">{opt.id}</div>
              <div className="text-xl font-bold">「{opt.text}」</div>
            </button>
          );
        })}
      </div>
      {result && (
        <div className={`pop-in rounded-3xl p-6 text-center border-2 ${result==='ok' ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`}>
          {result==='ok' ? (
            <><div className="text-5xl mb-2">🎉</div><p className="text-3xl font-black text-emerald-600 mb-2">正解！ 答对了！</p><p className="text-emerald-700 text-sm leading-relaxed">{quiz.ok_msg}</p></>
          ) : (
            <><div className="text-5xl mb-2">😅</div><p className="text-3xl font-black text-rose-500 mb-2">惜しい！ 太可惜了～</p><p className="text-rose-600 text-sm leading-relaxed">{quiz.ng_msg}</p></>
          )}
        </div>
      )}
      {result && (
        <div className="fiu space-y-3">
          <details className="bg-gray-50 border border-gray-200 rounded-2xl p-4 text-xs text-gray-400">
            <summary className="cursor-pointer font-medium select-none">📊 セッションデータ（Excel連携用）/ 学习记录 JSON</summary>
            <pre className="mt-3 bg-white rounded-xl p-3 border border-gray-100 overflow-x-auto text-gray-500 leading-relaxed">{JSON.stringify(log,null,2)}</pre>
          </details>
          <button onClick={reset} className="w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-black py-4 rounded-2xl transition-all shadow-md hover:shadow-xl active:scale-[.98]">
            🔄 もう一度挑戦する / 再试一次
          </button>
        </div>
      )}
    </div>
  );
}

/* Mount */
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
